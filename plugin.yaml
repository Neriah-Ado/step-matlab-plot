id: step-matlab-plot
name: Step Matlab Plot
description: "MATLAB 画图插件：结构化规格生成出版级图表（16 类图形，导出 png/pdf/svg/jpg/fig），持久化会话复用 MATLAB，任意 MATLAB 代码默认 dry-run、confirm 后执行"
form: hybrid
priority: P2
effort: M
status: done
manifest: step.plugin.json
requires_env: []
verify:
  - "fake 缝端到端：env→plot（16 类图形）→plot_many→ls→read 全流程"
  - "真机 MATLAB（R2026a）16 类会话模式矩阵出图并被视觉验证"
  - "会话相对一次性提速 ≥50%（实测 93.4%）"
  - "5+5+5 个子代理并行验证发现的问题全部修复并回归通过"
versions:
